[package]
name = "async-net-qemu-virt"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false
license = "MIT"

# Independent workspace: guest panic/boot settings must not affect host tools.
[workspace]

[dependencies]
async-net-stack-core = { path = "../../portable" }

[[bin]]
name = "net-boot"
path = "src/main.rs"
test = false
bench = false

[features]
heap-oom-test = []

[profile.dev]
panic = "abort"
[profile.release]
panic = "abort"
debug = 2
