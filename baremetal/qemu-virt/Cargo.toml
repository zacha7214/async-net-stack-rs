[package]
name = "async-net-qemu-virt"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"
publish = false
license = "MIT"

# Board crate: QEMU virt addresses, layout and the virtio regression scenario.
# Profiles (panic = "abort") come from the baremetal workspace.
[dependencies]
async-net-stack-core = { path = "../../portable" }
runtime = { package = "async-net-baremetal-runtime", path = "../runtime" }

[[bin]]
name = "net-boot"
path = "src/main.rs"
test = false
bench = false

[features]
heap-oom-test = []

