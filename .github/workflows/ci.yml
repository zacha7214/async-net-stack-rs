name: networking checks
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --all-targets --all-features
      - run: cargo test --locked --no-default-features
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo build --locked --example shm_nic
      - run: python3 scripts/shm-nic-smoke.py --binary target/debug/examples/shm_nic
      - run: cargo build --locked --example vhost_user_net
      - run: python3 scripts/vhost-user-smoke.py --binary target/debug/examples/vhost_user_net
      - run: python3 scripts/check-vhost-run-test.py
      - if: runner.os == 'Linux'
        run: cargo test --locked --all-features datagrams_batch_complete_and_cancel_without_traffic -- --ignored --nocapture
  linux-veth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y iproute2 iputils-ping ethtool
      - run: cargo build --locked --release --features xdp --examples
      - run: sudo ./scripts/linux-veth-smoke.sh

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75.0
      - run: cargo check --locked --all-targets --all-features

  capture-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y tcpdump iproute2 ethtool
      - run: cargo build --locked --bins
      - run: sudo python3 scripts/capture-bundle-smoke.py

  portable-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-unknown-none-softfloat,riscv64gc-unknown-none-elf
      - run: cargo test --locked -p async-net-stack-core
      - run: cargo clippy --locked -p async-net-stack-core --all-targets --all-features -- -D warnings
      - run: cargo build --locked -p async-net-stack-core --target aarch64-unknown-none-softfloat
      - run: cargo build --locked -p async-net-stack-core --target riscv64gc-unknown-none-elf
      - uses: dtolnay/rust-toolchain@1.77.0
      - run: cargo check --locked -p async-net-stack-core
